<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ 무선 음성 입력기 (PC 크롬 전용 v11)</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 30px; background-color: #f0f4f8; color: #333; }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #1a365d; margin-top: 0; font-size: 1.6em; }
    p.desc { color: #666; font-size: 0.95em; margin-bottom: 25px; }
    .status-box { margin: 20px 0; padding: 18px; border-radius: 10px; font-weight: bold; font-size: 1.3em; transition: all 0.3s ease; }
    .listening { background-color: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7; }
    .stopped { background-color: #ffebee; color: #c62828; border: 2px solid #ef9a9a; }
    .btn-group { margin: 20px 0; }
    button { padding: 14px 28px; font-size: 1.1em; margin: 0 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-start { background-color: #2e7d32; color: white; }
    .btn-stop { background-color: #c62828; color: white; }
    .guide-card { background-color: #ebf8ff; border: 1px solid #bee3f8; border-radius: 8px; padding: 12px 15px; margin: 20px 0; text-align: left; font-size: 0.9em; color: #2b6cb0; line-height: 1.5; }
    #log { text-align: left; background: #fafafa; padding: 15px; border-radius: 8px; height: 280px; overflow-y: auto; border: 1px solid #e2e8f0; font-size: 0.92em; line-height: 1.6; }
    .log-raw { color: #1565c0; }
    .log-success { color: #2e7d32; font-weight: bold; }
    .log-err { color: #c62828; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎙️ 환자 이름 음성 입력기 (PC 크롬 전용 v11)</h2>
    <p class="desc">진료실 PC 크롬 브라우저에서 실행하는 연속 음성 감지 프로그램입니다.</p>

    <div id="status" class="status-box stopped">🔴 음성 감지 정지됨</div>
    
    <div class="btn-group">
      <button class="btn-start" onclick="startRecognition()">🟢 업무 시작 (마이크 켜기)</button>
      <button class="btn-stop" onclick="stopRecognition()">🔴 업무 종료 (마이크 끄기)</button>
    </div>

    <div class="guide-card">
      💡 <strong>PC 사용 팁:</strong> PC 크롬 브라우저 상단 주소창 옆의 <strong>마이크 허용(🔒)</strong>을 확인해 주세요. 음성이 입력되면 구글 시트로 자동 전송되며, PC에서 <strong>F2 키</strong>를 누르면 OK차트 검색창에 이름이 즉시 입력됩니다.
    </div>

    <h3 style="text-align: left; font-size: 1.1em; color: #4a5568; margin-bottom: 10px;">실시간 감지 및 전송 기록</h3>
    <div id="log"></div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxzeAcbPLm29lVgz1pds9dPB0vAStIwovZnTc-Id74RwuQhPpDS-5Y_RW309KUTFxLQ/exec";

    let recognition;
    let isAutoRestart = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.interimResults = false;
      recognition.continuous = true; // PC 크롬 전용: 무한 연속 감지 설정

      recognition.onstart = function() {
        updateStatus(true);
        addLog("▶️ PC 마이크 활성화됨 (음성 들을 준비 완료)");
      };

      recognition.onresult = function(event) {
        try {
          const lastIndex = event.results.length - 1;
          const res = event.results[lastIndex];
          if (res && res[0] && res[0].transcript) {
            const text = res[0].transcript.trim();
            addLog("🎤 인식된 음성: [" + text + "]", "log-raw");
            processVoiceText(text);
          }
        } catch(e) {
          addLog("❌ 결과 처리 중 오류: " + e.message, "log-err");
        }
      };

      recognition.onend = function() {
        if (isAutoRestart) {
          setTimeout(() => {
            if (isAutoRestart) {
              try { recognition.start(); } catch(e) {}
            }
          }, 300);
        } else {
          updateStatus(false);
          addLog("⏹️ 음성 인식 정지됨");
        }
      };

      recognition.onerror = function(event) {
        if (event.error === 'no-speech') return;
        addLog("❌ 마이크 에러: " + event.error, "log-err");
        if (event.error === 'not-allowed') {
          isAutoRestart = false;
          updateStatus(false);
          alert("PC 마이크 권한이 거부되었습니다. 주소창 좌측 자물쇠(🔒) 아이콘을 눌러 마이크를 허용해 주세요.");
        } else if (isAutoRestart) {
          setTimeout(() => { if (isAutoRestart) recognition.start(); }, 1000);
        }
      };
    } else {
      alert("이 브라우저는 음성 인식을 지원하지 않습니다. PC 크롬(Google Chrome) 브라우저를 사용해 주세요.");
    }

    // 대한민국 주요 성씨 정규식 (성씨로 시작하는 2~4글자 이름)
    const KOREAN_NAME_REGEX = /^(남궁|황보|제갈|선우|독고|사공|[김이박최정강조윤장임한오서신권황안송류유홍전고문손양배조백허유남심노하곽성차주우구신임나전민유진지엄채원천방공강현함변염양변여추노도소신석선설마길주연방위표명기반왕금옥육인맹제모탁국여진어은편])[가-힣]{1,3}$/;

    function startRecognition() {
      if (!recognition) {
        alert("이 브라우저는 음성 인식을 지원하지 않습니다. PC 크롬 브라우저를 사용해 주세요.");
        return;
      }
      isAutoRestart = true;
      try {
        recognition.start();
        updateStatus(true);
        requestWakeLock();
      } catch (e) {
        addLog("ℹ️ 이미 감지 작동 중입니다.");
      }
    }

    function stopRecognition() {
      isAutoRestart = false;
      if (recognition) recognition.stop();
      updateStatus(false);
    }

    function updateStatus(listening) {
      const statusDiv = document.getElementById('status');
      if (listening) {
        statusDiv.className = 'status-box listening';
        statusDiv.innerHTML = '🟢 음성 감지 중 (대기 상태)';
      } else {
        statusDiv.className = 'status-box stopped';
        statusDiv.innerHTML = '🔴 음성 감지 정지됨';
      }
    }

    function processVoiceText(text) {
      let cleanedName = text
        // 1. 원장님 복창 확인 멘트 제거 (이시죠, 맞으시죠, 이신가요 등)
        .replace(/이시죠|맞으시죠|맞으신가요|이신가요|맞죠|이시고요|이신가|맞나요|맞지/g, '')
        // 2. 질문/안내 및 수식어 제거
        .replace(/성함이\s*어떻게\s*되세요|성함이\s*어떻게\s*되시죠|성함이\s*어떻게\s*되나요|성함이|이름이\s*어떻게\s*되세요|이름이|어떻게\s*되세요|어떻게\s*되시죠|어떻게\s*되나요/g, '')
        .replace(/안녕하세요|안녕하세|반갑습니다|어서오세요|네네|잠시만요/g, '')
        .replace(/저는|이름은|성함은|환자|님|들어오세요|다음/g, '')
        .replace(/입니다|인데요|이요|이라고 합니다|라구요|이구요|요|네/g, '')
        .trim();

      if (KOREAN_NAME_REGEX.test(cleanedName)) {
        addLog("✨ 이름 추출 성공: [" + cleanedName + "] ➔ 구글 시트 전송 중...", "log-success");
        
        fetch(GAS_WEB_APP_URL + "?action=add&name=" + encodeURIComponent(cleanedName), { mode: 'no-cors' })
          .then(() => {
            addLog("✅ 구글 시트 전송 완료!", "log-success");
          })
          .catch(err => {
            addLog("❌ 전송 실패: " + err.message, "log-err");
          });
      } else {
        addLog("ℹ️ [" + text + " ➔ " + cleanedName + "]: 성씨/이름 조건 미충족으로 전송 제외됨");
      }
    }

    function addLog(msg, cssClass) {
      const logDiv = document.getElementById('log');
      const p = document.createElement('p');
      if (cssClass) p.className = cssClass;
      p.style.margin = "4px 0";
      p.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
      logDiv.prepend(p);
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }
  </script>
</body>
</html>
