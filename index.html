<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ 무선 음성 입력기 (PC 크롬 전용 v15 - 성씨 정밀 검증)</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 30px; background-color: #f0f4f8; color: #333; }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #1a365d; margin-top: 0; font-size: 1.6em; }
    p.desc { color: #666; font-size: 0.95em; margin-bottom: 25px; }
    .status-box { margin: 20px 0; padding: 18px; border-radius: 10px; font-weight: bold; font-size: 1.3em; transition: all 0.3s ease; }
    .listening { background-color: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7; }
    .stopped { background-color: #ffebee; color: #c62828; border: 2px solid #ef9a9a; }
    .btn-group { margin: 20px 0; }
    button { padding: 14px 28px; font-size: 1.1em; margin: 0 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-start { background-color: #2e7d32; color: white; }
    .btn-stop { background-color: #c62828; color: white; }
    .guide-card { background-color: #ebf8ff; border: 1px solid #bee3f8; border-radius: 8px; padding: 12px 15px; margin: 20px 0; text-align: left; font-size: 0.9em; color: #2b6cb0; line-height: 1.5; }
    #log { text-align: left; background: #fafafa; padding: 15px; border-radius: 8px; height: 280px; overflow-y: auto; border: 1px solid #e2e8f0; font-size: 0.92em; line-height: 1.6; }
    .log-raw { color: #1565c0; }
    .log-success { color: #2e7d32; font-weight: bold; }
    .log-err { color: #c62828; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎙️ 환자 이름 음성 입력기 (v15 - 성씨 정밀 검증)</h2>
    <p class="desc">대한민국 성씨 목록 기반 3글자 환자 이름 전용 음성 입력기입니다.</p>

    <div id="status" class="status-box stopped">🔴 음성 감지 정지됨</div>
    
    <div class="btn-group">
      <button class="btn-start" onclick="startRecognition()">🟢 업무 시작 (마이크 켜기)</button>
      <button class="btn-stop" onclick="stopRecognition()">🔴 업무 종료 (마이크 끄기)</button>
    </div>

    <div class="guide-card">
      💡 <strong>성씨 기반 검증:</strong> 대한민국 실제 성씨(김,이,박,최,정,강,조 등)로 시작하는 3글자 이름만 정밀 추출됩니다. 일상 단어('핸드폰', '정말이야', '받았더니')는 자동 차단됩니다.
    </div>

    <h3 style="text-align: left; font-size: 1.1em; color: #4a5568; margin-bottom: 10px;">실시간 감지 및 전송 기록</h3>
    <div id="log"></div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxzeAcbPLm29lVgz1pds9dPB0vAStIwovZnTc-Id74RwuQhPpDS-5Y_RW309KUTFxLQ/exec";

    let recognition;
    let isAutoRestart = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.interimResults = false;
      recognition.continuous = true;

      recognition.onstart = function() {
        updateStatus(true);
        addLog("▶️ 마이크 활성화됨 (음성 들을 준비 완료)");
      };

      recognition.onresult = function(event) {
        try {
          const lastIndex = event.results.length - 1;
          const res = event.results[lastIndex];
          if (res && res[0] && res[0].transcript) {
            const text = res[0].transcript.trim();
            addLog("🎤 인식된 음성: [" + text + "]", "log-raw");
            processVoiceText(text);
          }
        } catch(e) {
          addLog("❌ 결과 처리 중 오류: " + e.message, "log-err");
        }
      };

      recognition.onend = function() {
        if (isAutoRestart) {
          setTimeout(() => {
            if (isAutoRestart) {
              try { recognition.start(); } catch(e) {}
            }
          }, 300);
        } else {
          updateStatus(false);
          addLog("⏹️ 음성 인식 정지됨");
        }
      };

      recognition.onerror = function(event) {
        if (event.error === 'no-speech') return;
        addLog("❌ 마이크 에러: " + event.error, "log-err");
        if (event.error === 'not-allowed') {
          isAutoRestart = false;
          updateStatus(false);
          alert("마이크 권한이 거부되었습니다. 주소창 자물쇠(🔒) 아이콘에서 마이크를 허용해 주세요.");
        } else if (isAutoRestart) {
          setTimeout(() => { if (isAutoRestart) recognition.start(); }, 1000);
        }
      };
    } else {
      alert("이 브라우저는 음성 인식을 지원하지 않습니다. PC 크롬 또는 모바일 브라우저를 사용해 주세요.");
    }

    // 대한민국 실제 성씨 목록 (배열 방식 검증)
    const KOREAN_SURNAMES = [
      '김','이','박','최','정','강','조','윤','장','임','한','오','서','신',
      '권','황','안','송','류','유','홍','전','고','문','손','양','배','백',
      '허','남','심','노','하','곽','성','차','주','우','구','나','민','진',
      '지','엄','채','원','천','방','공','현','함','염','추','도','소','석',
      '선','설','마','길','연','위','표','명','기','반','왕','금','옥','육',
      '맹','제','모','탁','국','은','편'
    ];

    const DOUBLE_SURNAMES = ['남궁', '황보', '제갈', '선우', '독고', '사공'];

    // 일상 대화 오인식 차단 예외 단어
    const EXCLUDED_WORDS = [
      '정말이', '정말야', '정말로', '정말인', '정신차', '정돈해', '정리해', '정확히', 
      '정상적', '정도껏', '정도면', '핸드폰', '받았더', '받았어', '들어와', '들어가'
    ];

    // 자동 오타 보정 사전 (필요시 추가)
    const CORRECTION_MAP = {
      "정민선": "정민서"
    };

    function isValidKoreanName(name) {
      if (!name || name.length !== 3) return false;
      if (EXCLUDED_WORDS.includes(name)) return false;
      
      // 1. 복성 2글자 + 이름 1글자 (예: 남궁민)
      if (DOUBLE_SURNAMES.includes(name.substring(0, 2))) return true;
      
      // 2. 단성 1글자 + 이름 2글자 (예: 김철수, 정민서)
      if (KOREAN_SURNAMES.includes(name[0])) return true;
      
      return false;
    }

    function startRecognition() {
      if (!recognition) {
        alert("이 브라우저는 음성 인식을 지원하지 않습니다.");
        return;
      }
      isAutoRestart = true;
      try {
        recognition.start();
        updateStatus(true);
        requestWakeLock();
      } catch (e) {
        addLog("ℹ️ 이미 감지 작동 중입니다.");
      }
    }

    function stopRecognition() {
      isAutoRestart = false;
      if (recognition) recognition.stop();
      updateStatus(false);
    }

    function updateStatus(listening) {
      const statusDiv = document.getElementById('status');
      if (listening) {
        statusDiv.className = 'status-box listening';
        statusDiv.innerHTML = '🟢 음성 감지 중 (대기 상태)';
      } else {
        statusDiv.className = 'status-box stopped';
        statusDiv.innerHTML = '🔴 음성 감지 정지됨';
      }
    }

    function processVoiceText(text) {
      // 0. 자동 오타 보정 사전 체크
      for (let wrong in CORRECTION_MAP) {
        if (text.includes(wrong)) {
          text = text.replace(new RegExp(wrong, 'g'), CORRECTION_MAP[wrong]);
        }
      }

      let extractedCandidate = "";

      // 1순위: '~님' 복창이 있는 경우 '님' 바로 앞 3글자 추출
      const nimMatch = text.match(/([가-힣]{3})\s*님/);
      if (nimMatch && nimMatch[1]) {
        extractedCandidate = nimMatch[1].trim();
      } else {
        // 2순위: '님'이 없는 경우 수식어/조사 제거
        extractedCandidate = text
          .replace(/이시죠|맞으시죠|맞으신가요|이신가요|맞죠|이시고요|이신가|맞나요|맞지|이시/g, '')
          .replace(/성함이\s*어떻게\s*되세요|성함이\s*어떻게\s*되시죠|성함이\s*어떻게\s*되나요|성함이|이름이\s*어떻게\s*되세요|이름이|어떻게\s*되세요|어떻게\s*되시죠|어떻게\s*되나요/g, '')
          .replace(/안녕하세요|안녕하세|반갑습니다|어서오세요|들어오세요|들어가세요|들어가세|네네|잠시만요/g, '')
          .replace(/저는|이름은|성함은|환자|님|다음/g, '')
          .replace(/입니다|인데요|이요|이라고 합니다|라구요|이구요|요|네/g, '')
          .trim();
      }

      // 성씨 기반 엄격 검증 수행
      if (isValidKoreanName(extractedCandidate)) {
        addLog("✨ 성씨 검증 통과 (3글자 이름): [" + extractedCandidate + "] ➔ 구글 시트 전송 중...", "log-success");
        
        fetch(GAS_WEB_APP_URL + "?action=add&name=" + encodeURIComponent(extractedCandidate), { mode: 'no-cors' })
          .then(() => {
            addLog("✅ 구글 시트 전송 완료!", "log-success");
          })
          .catch(err => {
            addLog("❌ 전송 실패: " + err.message, "log-err");
          });
      } else {
        addLog("ℹ️ [" + text + " ➔ " + extractedCandidate + "]: 성씨 미일치 또는 일상 단어로 판단되어 전송 제외됨");
      }
    }

    function addLog(msg, cssClass) {
      const logDiv = document.getElementById('log');
      const p = document.createElement('p');
      if (cssClass) p.className = cssClass;
      p.style.margin = "4px 0";
      p.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
      logDiv.prepend(p);
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }
  </script>
</body>
</html>
